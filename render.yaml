services:
  - type: web
    name: hazernit-youtube-gemini-mcp
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    autoDeploy: false
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MCP_SECRET_PATH
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_CALLS_PER_DAY
        value: '15'
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: '2048'
